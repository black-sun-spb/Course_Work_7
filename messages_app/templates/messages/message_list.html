<h1>Список сообщений</h1>
<a href="{% url 'messages_app:create' %}">Создать новое сообщение</a>
<ul>
  {% for m in messages %}
    <li>
      {{ m.subject }}
      <a href="{% url 'messages_app:update' m.pk %}">Редактировать</a>
      <a href="{% url 'messages_app:delete' m.pk %}">Удалить</a>
    </li>
  {% endfor %}
</ul>
